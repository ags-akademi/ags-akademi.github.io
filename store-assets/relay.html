<!doctype html><meta charset="utf-8"><title>relay</title>
<script>
// Geçici: App Store Connect'e görsel aktarımı için. İş bitince silinecek.
const files = location.hash.slice(1).split(',').filter(Boolean);
(async () => {
  for (const f of files) {
    const blob = await (await fetch(f)).blob();
    parent.postMessage({ __asc: true, name: f, blob }, 'https://appstoreconnect.apple.com');
  }
  parent.postMessage({ __asc: true, done: true }, 'https://appstoreconnect.apple.com');
})();
</script>
